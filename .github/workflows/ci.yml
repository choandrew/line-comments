name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Start SeaweedFS with S3 auth
        run: |
          echo '{"identities":[{"name":"test","credentials":[{"accessKey":"test-key","secretKey":"test-secret"}],"actions":["Admin","Read","Write","List"]}]}' > /tmp/s3.json
          docker run -d --name seaweedfs -p 18333:8333 -v /tmp/s3.json:/etc/s3.json:ro chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3.json
          timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:18333/; do sleep 1; done'
          echo 's3.bucket.create -name test' | docker exec -i seaweedfs weed shell
      - name: Start SeaweedFS without auth
        run: |
          docker run -d --name seaweedfs-open -p 18334:8333 chrislusf/seaweedfs:4.48 server -s3
          timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:18334/; do sleep 1; done'
          echo 's3.bucket.create -name test' | docker exec -i seaweedfs-open weed shell
      - run: npm ci
      - run: npm run check
        env:
          LINE_COMMENTS_TEST_S3: http://test-key:test-secret@localhost:18333/test
          LINE_COMMENTS_TEST_S3_OPEN: http://localhost:18334/test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: line-comments.vsix
          path: line-comments.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: line-comments.vsix
      - run: gh release create "$GITHUB_REF_NAME" line-comments.vsix --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
